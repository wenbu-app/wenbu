<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 588 234" role="img" aria-label="Featured on SaaS.fyi">
  <title>Featured on SaaS.fyi</title>
  <defs>
    <linearGradient id="sfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="48%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="sfHi" cx="22%" cy="18%" r="78%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="62%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sfShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1a0a00" flood-opacity="0.14"/>
    </filter>
    <filter id="sfMarkShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#7c2d12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Pill background -->
  <rect x="3" y="3" width="582" height="228" rx="38" fill="url(#sfBg)" filter="url(#sfShadow)"/>
  <rect x="3" y="3" width="582" height="228" rx="38" fill="url(#sfHi)"/>

  <!-- Subtle inner stroke for crispness -->
  <rect x="3.5" y="3.5" width="581" height="227" rx="37.5" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>

  <!-- Mark: 4-petal sparkle with curved concave sides (cubic Bezier) -->
  <g transform="translate(94, 117)" filter="url(#sfMarkShadow)">
    <path d="
      M 0 -68
      C 0 -28, 28 0, 68 0
      C 28 0, 0 28, 0 68
      C 0 28, -28 0, -68 0
      C -28 0, 0 -28, 0 -68
      Z" fill="white"/>
    <!-- Tiny accent dot in the center for editorial detail -->
    <circle cx="0" cy="0" r="5" fill="url(#sfBg)" opacity="0.92"/>
  </g>

  <!-- Text block — vertically centered around pill center (y=117).
       Stack visual extent: top of FEATURED ON at ~y=60 to descender of
       tagline at ~y=174 → visual center y=117. -->

  <!-- Text: FEATURED ON -->
  <text x="186" y="76" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="600" font-size="22" fill="white" letter-spacing="5" opacity="0.94">FEATURED ON</text>

  <!-- Text: saas.fyi (big) -->
  <text x="186" y="144" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="800" font-size="62" fill="white" letter-spacing="-2.4">SaaS<tspan fill="#ffffff" opacity="0.72">.fyi</tspan></text>

  <!-- Tagline -->
  <text x="186" y="170" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="500" font-size="17" fill="white" letter-spacing="-0.3" opacity="0.92">The curated SaaS directory</text>
</svg>
